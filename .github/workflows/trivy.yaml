name: Trivy Security Scan

on:
  push:
    branches:
      - main
      - dev
      - secure-demo

  pull_request:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
            scan-type: fs
            scan-ref: .
            format: table
            exit-code: "1"
            severity: HIGH,CRITICAL